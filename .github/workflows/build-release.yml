name: Build TikTok-RV release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-release.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download stock TikTok
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="com.zhiliaoapp.musically"
          DOWNLOAD_DIR="$GITHUB_WORKSPACE/tiktok_original_dl"
          mkdir -p "$DOWNLOAD_DIR"

          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install gplaydl

          uv tool run gplaydl auth --arch arm64 || true
          if ! uv tool run gplaydl download "$PACKAGE" -a arm64 --no-extras -o "$DOWNLOAD_DIR"; then
            echo "gplaydl failed; falling back to APKPure via apkeep"
          fi

          if ! find "$DOWNLOAD_DIR" -maxdepth 1 -type f | grep -q .; then
            wget -q https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-x86_64-unknown-linux-gnu -O apkeep
            chmod +x apkeep
            ./apkeep -a "$PACKAGE" -d apk-pure "$DOWNLOAD_DIR"
          fi

          shopt -s nullglob
          archives=("$DOWNLOAD_DIR"/*.xapk "$DOWNLOAD_DIR"/*.apks)
          for archive in "${archives[@]}"; do
            extract_dir="$DOWNLOAD_DIR/extracted_$(basename "$archive")"
            mkdir -p "$extract_dir"
            unzip -q "$archive" -d "$extract_dir"
            find "$extract_dir" -type f -name '*.apk' -exec cp -f {} "$DOWNLOAD_DIR"/ \;
            rm -f "$archive"
          done
          shopt -u nullglob

          echo "==> Downloaded APK files"
          find "$DOWNLOAD_DIR" -maxdepth 1 -type f -name '*.apk' -printf '%f  %k KB\n' | sort

          BASE_APK=""
          if [ -f "$DOWNLOAD_DIR/$PACKAGE.apk" ]; then
            BASE_APK="$DOWNLOAD_DIR/$PACKAGE.apk"
          elif [ -f "$DOWNLOAD_DIR/base.apk" ]; then
            BASE_APK="$DOWNLOAD_DIR/base.apk"
          else
            BASE_APK=$(find "$DOWNLOAD_DIR" -maxdepth 1 -type f -name '*.apk' \
              ! -name '*-asset.apk' \
              ! -name '*df_*.apk' \
              ! -name 'config.*.apk' \
              ! -name 'split_*.apk' \
              -exec ls -S {} + 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$BASE_APK" ] || [ ! -f "$BASE_APK" ]; then
            echo "ERROR: could not locate the real base APK"
            exit 1
          fi

          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)
          BADGING=$($AAPT dump badging "$BASE_APK")
          ACTUAL_PACKAGE=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")

          if [ "$ACTUAL_PACKAGE" != "$PACKAGE" ]; then
            echo "ERROR: selected APK has package '$ACTUAL_PACKAGE', expected '$PACKAGE'"
            exit 1
          fi

          BASE_APK_NAME=$(basename "$BASE_APK")
          VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)

          cp "$BASE_APK" "$GITHUB_WORKSPACE/raw-base-original.apk"
          echo "BASE_APK_NAME=$BASE_APK_NAME" >> "$GITHUB_ENV"
          echo "TIKTOK_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "==> Selected base: $BASE_APK_NAME"
          echo "==> TikTok version: $VERSION_NAME"
          echo "$BADGING" | head -n 3

      - name: Build ReVanced patches
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd revanced-patches
          chmod +x gradlew
          ./gradlew build -x test

      - name: Download ReVanced CLI and APKEditor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CLI_URL=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ReVanced/revanced-cli/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".jar")) | select(.name | endswith(".sig") | not) | .browser_download_url' \
            | head -n1)

          if [ -z "$CLI_URL" ] || [ "$CLI_URL" = "null" ]; then
            echo "ERROR: ReVanced CLI asset not found"
            exit 1
          fi

          wget -q "$CLI_URL" -O revanced-cli.jar
          wget -q https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar -O APKEditor.jar

      - name: Patch and merge TikTok
        shell: bash
        run: |
          set -euo pipefail

          PATCH_BUNDLE=$(find revanced-patches/patches/build/libs -type f -name 'patches-*.rvp' ! -name '*sources*' | head -n1)
          if [ -z "$PATCH_BUNDLE" ] || [ ! -f "$PATCH_BUNDLE" ]; then
            echo "ERROR: patch bundle not found"
            exit 1
          fi

          java -jar revanced-cli.jar patch raw-base-original.apk \
            -p "$PATCH_BUNDLE" \
            -b \
            -o unsigned-tiktok-original.apk \
            --exclusive \
            -e "Settings" \
            -e "Feed filter" \
            -e "Downloads" \
            -e "SIM spoof" \
            -e "Remember clear display" \
            -e "Show seekbar" \
            -e "Playback speed" \
            -e "Disable login requirement"

          SPLITS_DIR="$GITHUB_WORKSPACE/splits_to_merge_original"
          SOURCE_DIR="$GITHUB_WORKSPACE/tiktok_original_dl"
          rm -rf "$SPLITS_DIR"
          mkdir -p "$SPLITS_DIR"

          # Replace only the stock base. Recent TikTok builds require the
          # remaining dynamic-feature, dex, asset, resource and config splits.
          cp unsigned-tiktok-original.apk "$SPLITS_DIR/base.apk"

          INCLUDED=0
          for apk in "$SOURCE_DIR"/*.apk; do
            [ -f "$apk" ] || continue
            name=$(basename "$apk")
            if [ "$name" = "$BASE_APK_NAME" ]; then
              echo "Skipping original unpatched base: $name"
              continue
            fi
            cp -f "$apk" "$SPLITS_DIR/$name"
            echo "Including original split: $name"
            INCLUDED=$((INCLUDED + 1))
          done

          echo "==> Included $INCLUDED original split APK(s) plus patched base"
          find "$SPLITS_DIR" -maxdepth 1 -type f -name '*.apk' -printf '%f  %k KB\n' | sort

          java -jar APKEditor.jar m \
            -i "$SPLITS_DIR" \
            -o unsigned-merged-original.apk

      - name: Restore persistent release signing key
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.TIKTOK_RV_SIGNING_BUNDLE_B64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_BUNDLE_B64:-}" ]; then
            echo "ERROR: GitHub Actions secret TIKTOK_RV_SIGNING_BUNDLE_B64 is not configured."
            exit 1
          fi

          umask 077
          mkdir -p "$RUNNER_TEMP/tiktok-rv-signing"
          printf '%s' "$SIGNING_BUNDLE_B64" | base64 -d > "$RUNNER_TEMP/signing-bundle.tar.gz"
          tar -xzf "$RUNNER_TEMP/signing-bundle.tar.gz" -C "$RUNNER_TEMP/tiktok-rv-signing"

          test -s "$RUNNER_TEMP/tiktok-rv-signing/release.keystore"
          test -s "$RUNNER_TEMP/tiktok-rv-signing/password.txt"
          test -s "$RUNNER_TEMP/tiktok-rv-signing/alias.txt"

          echo "SIGNING_DIR=$RUNNER_TEMP/tiktok-rv-signing" >> "$GITHUB_ENV"
          echo "==> Persistent release key restored"

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_CERT_SHA256="b26bce542444c126404857c14d36470af32452e9ced40a34a10cfffb47101f0f"
          KS="$SIGNING_DIR/release.keystore"
          KS_PASS=$(cat "$SIGNING_DIR/password.txt")
          KS_ALIAS=$(cat "$SIGNING_DIR/alias.txt")
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)

          "$APKSIGNER" sign \
            --ks "$KS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --out tiktok-rv-original.apk \
            unsigned-merged-original.apk

          "$APKSIGNER" verify --verbose --print-certs tiktok-rv-original.apk | tee signing-certificate.txt
          if ! tr '[:upper:]' '[:lower:]' < signing-certificate.txt | grep -q "$EXPECTED_CERT_SHA256"; then
            echo "ERROR: APK was signed with an unexpected certificate"
            exit 1
          fi

          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)
          "$AAPT" dump badging tiktok-rv-original.apk | head -n 5
          unzip -l tiktok-rv-original.apk AndroidManifest.xml
          sha256sum tiktok-rv-original.apk | tee tiktok-rv-original.apk.sha256

          rm -rf "$SIGNING_DIR" "$RUNNER_TEMP/signing-bundle.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-rv-release-${{ env.TIKTOK_VERSION }}
          path: |
            tiktok-rv-original.apk
            tiktok-rv-original.apk.sha256
            signing-certificate.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${TIKTOK_VERSION}-fixed.1"
          TITLE="TikTok-RV ${TIKTOK_VERSION} — fixed split build"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          cat > "$NOTES_FILE" <<EOF
          Compatibility build for TikTok ${TIKTOK_VERSION} based on the open-source TikTok-RV/ReVanced patch set.

          This repository is a fork of [thelok1s/tiktok-rv](https://github.com/thelok1s/tiktok-rv), not the original project.

          ### What is fixed
          - selects the real TikTok base APK instead of a dynamic-feature split;
          - keeps every required non-base split during the universal APK merge, preventing the splash-screen crash seen in newer TikTok builds;
          - uses one persistent release signing key so future releases can be installed as updates.

          ### Included patches
          ReVanced settings, feed ad filtering, downloads, SIM region spoof, remembered Clear Display, seekbar, playback speed, and optional login-requirement bypass.

          ### Installation note
          Earlier test builds from this fork used disposable signing keys. Uninstall those once before installing this release. Future releases signed with this release key should update normally.

          Release signing certificate SHA-256:
          `B2:6B:CE:54:24:44:C1:26:40:48:57:C1:4D:36:47:0A:F3:24:52:E9:CE:D4:0A:34:A1:0C:FF:FB:47:10:1F:0F`

          Tested on an Android emulator: installation, launch and patched TikTok functionality are working.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              tiktok-rv-original.apk \
              tiktok-rv-original.apk.sha256 \
              signing-certificate.txt \
              --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              tiktok-rv-original.apk \
              tiktok-rv-original.apk.sha256 \
              signing-certificate.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi
